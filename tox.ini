[tox]
# Use conda environments when available (includes Python dev libraries on Windows)
# Falls back to regular venv if tox-conda is not installed

[testenv]
basepython = python
# Use conda for Python (includes dev libraries) if tox-conda is available
# Falls back to basepython if conda is not available
conda_deps = 
    python
    cmake
[testenv:py39]
basepython = python3.9
conda_deps = 
    python=3.9
    cmake
[testenv:py310]
basepython = python3.10
conda_deps = 
    python=3.10
    cmake
[testenv:py311]
basepython = python3.11
conda_deps = 
    python=3.11
    cmake
[testenv:py312]
basepython = python3.12
conda_deps = 
    python=3.12
    cmake
[testenv:py313]
basepython = python3.13
conda_deps = 
    python=3.13
    cmake
[testenv:py314]
basepython = python3.14
conda_deps = 
    python=3.14
    cmake
deps =
    setuptools
    readme_renderer
    flake8
    cpplint
    pytest
    numpy
commands =
    python -c "import subprocess, sys, os; conda_exists = subprocess.run(['conda', '--version'], capture_output=True, shell=sys.platform=='win32').returncode == 0; in_conda_env = bool(os.environ.get('CONDA_PREFIX') or os.environ.get('CONDA_DEFAULT_ENV')); conda_exists and not in_conda_env and print('WARNING: conda is available but tox-conda is not installed. Using venv instead of conda environment. Install tox-conda to use conda environments.') or None"
    python setup.py check -m -r -s
    pip install -r tests/requirements.txt
    flake8 .
    #cpplint --linelength=100 --recursive naturalneighbor
    python setup.py build_ext --inplace
    pip install -e .
    pytest
    pip install -r demo/demo-requirements.txt
    python demo/demo.py
    python -c "import sys, subprocess, os; script = 'cpptests/test.bat' if sys.platform == 'win32' else 'cpptests/test.sh'; script_path = os.path.abspath(script); cmd = ['cmd', '/c', script_path] if sys.platform == 'win32' else ['bash', script_path]; subprocess.run(cmd, check=True)"

[flake8]
exclude = .tox,*.egg,build,data
select = E,W,F
max-line-length = 120
ignore = E402
