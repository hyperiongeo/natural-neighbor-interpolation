
name: Python CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # Automatically cache dependencies based on pyproject.toml
          cache: 'pip' 
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test] # Installs the project and its 'test' optional dependencies

      - name: Run tests
        run: pytest

