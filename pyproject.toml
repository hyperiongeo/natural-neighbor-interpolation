[build-system]
requires = ["setuptools>=77.0.0", "wheel", "numpy>=1.13"]
build-backend = "setuptools.build_meta"

[project]
name = "naturalneighbor"
version = "0.2.2"
description = "Fast, discrete natural neighbor interpolation in 3D on a CPU."
readme = "README.rst"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Reece Stevens", email = "rstevens@innolitics.com"}
]
keywords = ["interpolation", "scipy", "griddata", "numpy", "sibson"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
dependencies = [
    "numpy>=1.13",
]

[project.urls]
Homepage = "https://github.com/innolitics/natural-neighbor-interpolation"
Repository = "https://github.com/innolitics/natural-neighbor-interpolation"

[tool.setuptools]
packages = ["naturalneighbor"]

[tool.setuptools.package-data]
naturalneighbor = ["*.h"]

